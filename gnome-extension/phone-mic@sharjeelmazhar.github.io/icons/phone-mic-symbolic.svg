<?xml version="1.0" encoding="UTF-8"?>
<!-- Phone Mic top-bar icon: a phone outline with a microphone inside. 16x16 symbolic, fills only so GNOME recolours it. -->
<svg height="16px" viewBox="0 0 16 16" width="16px" xmlns="http://www.w3.org/2000/svg">
    <!-- phone frame (same geometry as Adwaita's phone-symbolic) -->
    <path d="m 5 0 c -1.644531 0 -3 1.355469 -3 3 v 10 c 0 1.644531 1.355469 3 3 3 h 6 c 1.644531 0 3 -1.355469 3 -3 v -10 c 0 -1.644531 -1.355469 -3 -3 -3 z m 0 2 h 6 c 0.570312 0 1 0.429688 1 1 v 10 c 0 0.554688 -0.445312 1 -1 1 h -6 c -0.554688 0 -1 -0.445312 -1 -1 v -10 c 0 -0.570312 0.429688 -1 1 -1 z m 0 0" fill="#2e3436"/>
    <!-- microphone capsule -->
    <rect x="6.75" y="3.25" width="2.5" height="4.75" rx="1.25" fill="#2e3436"/>
    <!-- cradle around the capsule -->
    <path d="M 5.25 6.5 v 1.25 a 2.75 2.75 0 0 0 5.5 0 v -1.25 h -1 v 1.25 a 1.75 1.75 0 0 1 -3.5 0 v -1.25 z" fill="#2e3436"/>
    <!-- stem and base -->
    <rect x="7.5" y="10.25" width="1" height="1.5" fill="#2e3436"/>
    <rect x="6.25" y="11.5" width="3.5" height="1" rx="0.5" fill="#2e3436"/>
</svg>
