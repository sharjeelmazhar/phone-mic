<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
<defs>
 <linearGradient id="bg" x1="24" y1="6" x2="84" y2="102" gradientUnits="userSpaceOnUse">
  <stop offset="0" stop-color="#4FA3FF"/><stop offset="0.45" stop-color="#6A4BFF"/><stop offset="1" stop-color="#F0428A"/></linearGradient>
 <radialGradient id="glow" cx="40" cy="26" r="60" gradientUnits="userSpaceOnUse">
  <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.30"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
 <linearGradient id="body" x1="42" y1="24" x2="66" y2="62" gradientUnits="userSpaceOnUse">
  <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0.18"/></linearGradient>
 <linearGradient id="rim" x1="43" y1="24" x2="65" y2="62" gradientUnits="userSpaceOnUse">
  <stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/><stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.35"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0.85"/></linearGradient>
 <linearGradient id="sheen" x1="54" y1="25" x2="54" y2="44" gradientUnits="userSpaceOnUse">
  <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.75"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
 <linearGradient id="core" x1="54" y1="34" x2="54" y2="56" gradientUnits="userSpaceOnUse">
  <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/><stop offset="1" stop-color="#FFE3F0" stop-opacity="0.9"/></linearGradient>
</defs>
<rect width="108" height="108" fill="url(#bg)"/>
<rect width="108" height="108" fill="url(#glow)"/>
<!-- waves -->
<path d="M76,41 a14,14 0 0 1 0,18 M32,41 a14,14 0 0 0 0,18" fill="none" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="3.4" stroke-linecap="round"/>
<path d="M82.5,35 a23,23 0 0 1 0,30 M25.5,35 a23,23 0 0 0 0,30" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="3.4" stroke-linecap="round"/>
<!-- stand -->
<path d="M40,53 a14,14 0 0 0 28,0 M54,67 v7 M47,76.5 h14" fill="none" stroke="#FFFFFF" stroke-opacity="0.95" stroke-width="3.4" stroke-linecap="round"/>
<!-- glass capsule -->
<rect x="43" y="23" width="22" height="39" rx="11" fill="url(#body)"/>
<rect x="43.7" y="23.7" width="20.6" height="37.6" rx="10.3" fill="none" stroke="url(#rim)" stroke-width="1.4"/>
<!-- inner bright core: the voice -->
<rect x="49.5" y="35" width="9" height="20" rx="4.5" fill="url(#core)"/>
<!-- sheen across the top -->
<path d="M46,34 a8,8 0 0 1 16,0 v1 a28,10 0 0 0 -16,0 z" fill="url(#sheen)"/>
</svg>
